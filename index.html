<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleveland Greenway Cleanup</title>
<meta name="description" content="Join your neighbors for weekly trash cleanup along the Cleveland Greenway in Cleveland, TN.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* ============================================
   CSS VARIABLES — Deep Earth Palette
   ============================================
   Shifted from flat forest green to layered
   earth tones: loam, bark, moss, river stone.
   --loam:         Deep soil brown, primary bg
   --loam-light:   Slightly lighter earth, modal bg
   --bark:         Warm dark brown, near-black
   --moss:         Golden-green, nature accent
   --moss-muted:   Desaturated moss for subtle use
   --river:        Cool blue-gray, water accent
   --amber:        Warm gold, CTA / action color
   --amber-light:  Hover state for amber
   --cream:        Warm off-white, primary text
   --cream-dark:   Muted cream, secondary text
   --sand:         Warm border/divider tone
   ============================================ */
:root {
  --loam: #1E1A14;
  --loam-light: #2A2318;
  --bark: #3D3228;
  --moss: #6B7F4A;
  --moss-muted: #4A5638;
  --river: #3D8FB5;   /* Vibrant stream blue. Bumped from muted
                         #7A9BA5 blue-gray to a saturated but
                         still-natural forest-stream blue. Used
                         in the hero river SVG and the logo badge. */
  --amber: #C49A2A;
  --amber-light: #D4A843;
  --cream: #F5F0E8;
  --cream-dark: #D5CEC2;
  --sand: #8A7D6B;
  --white: #FFFFFF;
  --ink: #1E1A14;        /* Always-dark token (kept for potential future use) */
  --dirt: #6B5538;       /* Rich warm brown — primary CTA background.
                            Replaced amber yellow. Works on both dark loam
                            bg and cream bg. Text on dirt = white/cream,
                            contrast ~7:1 (passes WCAG AAA). */
  --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --display: 'DM Serif Display', Georgia, serif;
  --cta-font: 'Bree Serif', Georgia, serif;
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-gentle: cubic-bezier(0.25, 0.1, 0.25, 1);
  --radius: 12px;
}

/* ============================================
   LIGHT MODE OVERRIDES — Field Journal palette
   ============================================
   When <body> has .light-mode, these five
   surface variables flip. Everything downstream
   that uses var(--loam), var(--cream), etc.
   recolors automatically via CSS variable
   inheritance — no other rules need to change.
   Flora stays green on cream (naturalist sketchbook look).
   ============================================ */
body.light-mode {
  --loam:        #D6CBAE;  /* dusty khaki parchment bg — "dirty" light mode.
                              RGB(214,203,174). Muted, earthy, warm. Sits in
                              the same earth-tone family as dark-mode --loam
                              (#1E1A14) and --loam-light (#4A3E32) but at
                              ~76% lightness. Lived-in, not sugary. */
  --loam-light:  #4A3E32;  /* DIRT — modal bg. Darker earthy tone (was cream
                              #EDE6D8). In light mode the modal now reads as a
                              dark-earth card floating on parchment, which pops
                              visually and solves the cream-on-cream contrast
                              collapse for form labels and helper text. */
  --cream:       #2D3A1E;  /* dark moss — primary text */
  --cream-dark:  #3D3228;  /* bark — secondary text */
  --sand:        #6B5E4C;  /* deeper sand for borders on cream */
}

/* When the modal renders in light mode its background flipped to dark dirt,
   so ALL text inside it must flip back to the cream palette. We do this by
   scoping the --cream/--cream-dark/--sand variables INSIDE .modal so every
   descendant using those tokens (title, inputs, labels via rgba fallback)
   renders correctly against the dark surface. This is a contained override —
   outside the modal, light-mode text stays dark moss on parchment as usual. */
body.light-mode .modal {
  --cream:      #F5F0E8;  /* re-pin cream for modal-body text */
  --cream-dark: #D5CEC2;  /* re-pin secondary cream */
  --sand:       rgba(245, 240, 232, 0.25);  /* cream-tinted divider */
}

/* ============================================
   GRASS BAND — earthy ground plane behind
   river + flora. Now an SVG element (same
   viewBox as the river) so the top edge can
   follow the exact curve of the stream.
   Top edge = river's upper bank shifted 120
   SVG units upward (1.5 × ~80-unit stream width).
   Fill uses an SVG mask for the fade so the
   solid fill color can be a CSS variable —
   that lets the mode toggle crossfade it.
   ============================================ */
:root {
  --grass-color: #3A5022;   /* dark earthy moss — dark mode */
}
body.light-mode {
  --grass-color: #48642C;   /* slightly brighter — parchment bg */
}

.grass-band {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;              /* behind river SVG (z:0) and all flora (z:0) */
  pointer-events: none;
  overflow: visible;
}

/* SVG path fill uses var(--grass-color) so the
   mode-toggle crossfade catches it */
.grass-band path {
  transition: fill 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* ============================================
   SMOOTH MODE CROSSFADE — 0.6s ease-in-out
   ============================================
   When the toggle fires, listed surfaces
   transition their bg + text + border over
   0.6s with cubic-bezier(0.25, 0.1, 0.25, 1).
   :where() gives zero specificity so any
   element-level transition (button hover, etc.)
   still wins. Matches the playbook's
   "slow and deliberate" principle.
   ============================================ */
:where(body, .hero, .modal, .modal-overlay,
       .hero h1, .hero-tagline, .hero-badge,
       .modal-title, .modal-sub,
       .form-group label, .form-group input, .form-group select,
       .hero-footer, .hero-footer a, .form-note,
       .modal-close, .color-mode-toggle, .grass-band) {
  transition: background-color 0.6s cubic-bezier(0.25, 0.1, 0.25, 1),
              color 0.6s cubic-bezier(0.25, 0.1, 0.25, 1),
              border-color 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
}

/* ============================================
   RESET
   ============================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: var(--sans);
  background: var(--loam);
  color: var(--cream);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  /* Prevent scroll when modal is open */
  overflow-x: hidden;
}

body.modal-open {
  overflow: hidden;
}

.skip-link {
  position: fixed;
  top: 0.75rem;
  left: 0.75rem;
  z-index: 2000;
  transform: translateY(-150%);
  background: var(--cream);
  color: var(--loam);
  padding: 0.65rem 0.9rem;
  border-radius: 999px;
  font-size: 0.875rem;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 8px 24px rgba(30, 26, 20, 0.18);
  transition: transform 0.2s var(--ease-gentle);
}

.skip-link:focus {
  transform: translateY(0);
}

/* ============================================
   HERO — full viewport, centered, minimal.
   Deep earth background with nature SVG art.
   ============================================ */
.hero {
  background: var(--loam);
  color: var(--cream);
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2rem 1.5rem 10rem;   /* extra bottom padding shifts the flex
                                    center point upward ~80px on desktop,
                                    clearing the top of the tree canopy */
  position: relative;
  overflow: hidden;
}

/* Warm atmospheric gradient — dark earth bottom,
   hint of moss warmth top-center, faint amber glow.
   These values are tuned for DARK bg. Light-mode
   overrides below remap them to work on cream. */
.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(107, 127, 74, 0.12) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 90%, rgba(61, 50, 40, 0.6) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 30%, rgba(196, 154, 42, 0.06) 0%, transparent 40%);
  pointer-events: none;
}

/* Light-mode atmospheric glow — same three radial
   positions but SUBTLER opacities so they whisper
   against cream instead of shouting. Moss is barely
   visible, bark glow in corner is very faint, amber
   stays warm. If these read too strong on cream,
   drop the opacities further. */
body.light-mode .hero::before {
  background: radial-gradient(ellipse at 50% 0%, rgba(107, 127, 74, 0.06) 0%, transparent 60%),
              radial-gradient(ellipse at 20% 90%, rgba(61, 50, 40, 0.05) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 30%, rgba(196, 154, 42, 0.08) 0%, transparent 40%);
}

/* ============================================
   SCENE CONTAINER — holds the river SVG + all
   flora icons. On desktop it fills the hero as
   an absolute overlay. On mobile it locks to a
   landscape aspect ratio so the percentage-based
   positions don't distort on portrait screens.
   ============================================ */
.scene-container {
  /* GROUND BAND — anchored to the bottom of the hero.
     aspect-ratio: 3 / 1 locks the scene to a 3:1 landscape
     shape at every viewport width. This is the key to stable
     tree positioning: a tree's width in vw becomes a known %
     of container height (5vw tree = 15% of container height),
     so each tree's BASE lands in the same spot relative to the
     stream SVG on every screen.
     max-width: 1920px — without this, viewports wider than
     1920px would hit the max-height cap and break the 3:1 ratio
     (container becomes wider than 3:1). That breaks the math:
     trees would render taller as a % of container height than
     predicted, and their BASES would land LOWER than intended —
     potentially on the path. Capping width preserves the ratio
     on every screen; sides beyond 1920px just show the dark
     loam background, which blends naturally with the hero. */
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  top: auto;
  width: 100%;
  max-width: 1920px;
  aspect-ratio: 3 / 1;
  max-height: 640px;
  pointer-events: none;
  z-index: 2;   /* above hero::after (z-index:1) so trees render over the fade */
  overflow: hidden;
  container-type: inline-size;     /* enables `cqw` unit inside — 1cqw = 1% of
                                      THIS container's width, not the viewport.
                                      Flora widths use cqw so tree size tracks
                                      the container, not the viewport. */
  container-name: scene;
}

/* River SVG — fills the scene container */
.hero-bg-art {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 1;
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   SCENE-TO-HERO FADE — lives on .hero::after
   so it can reach ABOVE the scene-container's
   top edge, which ::after on the container
   itself cannot do (overflow:hidden clips it).
   The gradient rises from solid loam at the
   bottom, stays solid through the scene band,
   then dissolves into transparent by the time
   it reaches the text area (~40% from top).
   hero-content is z-index:2, this is z-index:1,
   so text and buttons always render above it.
   ============================================ */
.hero::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 100%;
  background: linear-gradient(
    to top,
    rgba(30, 26, 20, 1)   0%,
    rgba(30, 26, 20, 1)   38%,
    rgba(30, 26, 20, 0)   58%
  );
  z-index: 1;
  pointer-events: none;
}

/* Light-mode version — same shape, parchment tone */
body.light-mode .hero::after {
  background: linear-gradient(
    to top,
    rgba(214, 203, 174, 1)  0%,
    rgba(214, 203, 174, 1)  38%,
    rgba(214, 203, 174, 0)  58%
  );
}

.hero-content {
  position: relative;
  z-index: 3;   /* above scene-container (z-index:2) so text sits on top */
  max-width: 600px;
}

/* ============================================
   FLORA ICONS — nature icons placed along both
   banks of the stream. Each is absolutely
   positioned within the scene container.
   Icons are sorted by top% in the HTML so
   higher-up icons render behind lower ones.
   ============================================ */
.flora-icon {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  width: 5cqw;            /* cqw = % of scene-container width (container query
                             unit). Previously `vw` — but that scales with the
                             viewport even when the container's capped at
                             1920px, so on ultra-wide monitors trees grew past
                             their predicted % of container height and their
                             BASES spilled onto the path. cqw keeps the ratio
                             stable. Individual tree widths in inline styles
                             also use `cqw`. */
  height: auto;
  aspect-ratio: 1;        /* Reserve a 1:1 box BEFORE the SVG loads.
                             Fixes CLS (Cumulative Layout Shift) from
                             108 icons popping into place one by one. */
  opacity: 1;
}

/* ============================================
   MOBILE: scene-container already scales correctly
   via aspect-ratio: 3/1. We just cap max-height
   differently and bump min-width on icons so trees
   don't shrink to invisibility on tiny phones.
   ============================================ */
@media (max-width: 768px) {
  .hero {
    justify-content: flex-start;  /* poster layout: content anchors to the
                                     top, scene fills the bottom — no more
                                     dead gap from vertical centering */
    padding-top: 3.5rem;
    padding-bottom: 2rem;
  }

  .scene-container {
    width: 280%;            /* wider than viewport = zoomed center crop.
                               the diagonal path in the SVG already reads
                               as SE slope — no rotation needed */
    max-width: 900px;
    aspect-ratio: auto;
    height: 240px;
    max-height: 240px;
    transform: translateX(-50%); /* re-center, no rotation */
  }

  .flora-icon {
    min-width: 24px;
    max-width: 52px;        /* second safety net — tree icons never
                               grow past 52px regardless of container */
  }
}

@media (max-width: 480px) {
  .scene-container {
    width: 300%;
    max-width: 900px;
    height: 220px;
    max-height: 220px;
    aspect-ratio: auto;
    transform: translateX(-50%);
  }

  .flora-icon {
    min-width: 20px;
    max-width: 44px;
  }
}

/* ============================================
   LOGO BADGE — compact emblem above the title.
   Trees + river in a circular SVG mark.
   ============================================ */
/* ============================================
   ENTRANCE CASCADE (condensed)
   ============================================
   Original cascade finished at 2.8s — too long
   for a QR-code stranger who'd bounce. Compressed,
   then slowed back down by 50% to preserve a more
   relaxed feel without returning to the original lag.
   CTA now appears by about 1.425s.
   Durations: 0.75s per item.
   ============================================ */
.hero-logo {
  width: 120px;
  height: 120px;
  margin: 0 auto 1.5rem;
  display: block;
  opacity: 0;
  animation: fade-in 0.75s ease 0.075s forwards;
}

.hero-badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--sand);
  margin-bottom: 1.5rem;
  opacity: 0;
  animation: fade-in 0.75s ease 0.18s forwards;
}

.hero h1 {
  font-family: var(--display);
  font-size: clamp(2.2rem, 8vw, 3.5rem);
  font-weight: 400;
  line-height: 1.15;
  margin-bottom: 2rem;
  color: var(--cream);
  opacity: 0;
  animation: fade-in 0.75s ease 0.3s forwards;
}

/* "Just show up." — slides in from the left.
   Shorter slide distance (was -40px, now -24px)
   so the longer duration still feels gentle. */
.hero-tagline {
  font-family: var(--display);
  font-size: clamp(1.44rem, 4.8vw, 1.92rem);
  font-weight: 400;
  font-style: italic;
  color: rgba(245, 240, 232, 0.6);
  margin-bottom: 3rem;
  opacity: 0;
  transform: translateX(-24px);
  animation: slide-in-left 0.825s cubic-bezier(0.25, 0.1, 0.25, 1) 0.525s forwards;
}

body.light-mode .hero-tagline {
  color: rgba(45, 58, 30, 0.72);
}

/* ============================================
   PRIMARY CTA — dirt-colored squircle button.
   ============================================
   Background: --dirt (#6B5538, tilled earth brown).
   Text: white (~7:1 contrast on dirt — passes AAA).
   Box-shadow: faint amber halo keeps the amber
     gradient warmth feeling intentional.
   Hover: brightens the dirt by ~12% via color-mix,
     lifts 2px, glow deepens.
   Press: scale(0.95) per playbook pattern.
   Entrance: overshoot settle at 1.125s duration
     with 1.375s delay — visible by about 2.5s.
   ============================================ */
.hero-cta {
  display: inline-block;
  background: var(--dirt);
  color: var(--cream-dark);
  font-family: var(--cta-font);
  font-size: 2.037rem;
  font-weight: 600;
  text-decoration: none;
  padding: 0.75rem 2rem;
  border-radius: 22px 18px 25px 16px / 16px 25px 18px 22px;
  border: none;
  cursor: pointer;
  transition: background 0.3s ease,
              transform 0.24s var(--ease-soft),
              box-shadow 0.3s ease,
              filter 0.32s var(--ease-gentle);
  box-shadow: 0 4px 20px rgba(196, 154, 42, 0.25);
  min-height: 44px;
  margin-top: -15px;
  opacity: 0;
  transform: scale(0.85);
  animation: cta-overshoot-in 1.125s cubic-bezier(0.22, 1, 0.36, 1) 1.375s forwards;
}

body:not(.light-mode) .hero-cta {
  background: #B8A07E;
  color: #2E241A;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
}

body.light-mode .hero-cta {
  color: #E6D1AE;
}

.hero-cta:hover {
  transform: translateY(-1px) scale(1.04);
  filter: brightness(1.05);
}

.hero-cta:active {
  transform: scale(0.95);
}

.hero-cta:focus-visible {
  outline: none;
  transform: translateY(-1px) scale(1.04);
  filter: brightness(1.05);
}

/* ============================================
   ANIMATIONS
   ============================================ */
@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slide-in-left {
  from {
    opacity: 0;
    transform: translateX(-40px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes cta-overshoot-in {
  0% {
    opacity: 0;
    transform: scale(0.85);
  }
  70% {
    opacity: 1;
    transform: scale(1.08);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}

/* ============================================
   COLOR MODE TOGGLE — top-right corner
   ============================================
   A fixed squircle control with a sun or moon
   SVG inside. Sits above hero content so it's
   always reachable, below modal z-index so it
   disappears when the modal is open.
   The two SVGs inside are both rendered; CSS
   hides whichever one doesn't match the current
   mode. This avoids any JS-side icon swapping
   and keeps things declarative.
   ============================================ */
.color-mode-toggle {
  position: fixed;
  top: 1rem;
  right: 1rem;
  width: 56px;
  height: 56px;
  border: none;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.35288 8.95043C4.00437 6.17301 6.17301 4.00437 8.95043 3.35288C10.9563 2.88237 13.0437 2.88237 15.0496 3.35288C17.827 4.00437 19.9956 6.17301 20.6471 8.95044C21.1176 10.9563 21.1176 13.0437 20.6471 15.0496C19.9956 17.827 17.827 19.9956 15.0496 20.6471C13.0437 21.1176 10.9563 21.1176 8.95044 20.6471C6.17301 19.9956 4.00437 17.827 3.35288 15.0496C2.88237 13.0437 2.88237 10.9563 3.35288 8.95043Z' fill='rgba(245,240,232,0.08)' stroke='rgba(245,240,232,0.22)' stroke-width='1.5'/%3E%3C/svg%3E") center / contain no-repeat;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cream);
  z-index: 100;
  opacity: 0;
  animation: fade-in 0.75s ease 1.05s forwards;
  /* Hover and press feel */
  transition: background 0.32s var(--ease-gentle), border-color 0.32s var(--ease-gentle),
              color 0.6s var(--ease-gentle),
              transform 0.24s var(--ease-soft);
}

.color-mode-toggle svg {
  width: 30px;
  height: 30px;
  position: relative;
  z-index: 1;
}

.color-mode-toggle:hover {
  transform: translateY(-1px) scale(1.04);
}

.color-mode-toggle:active {
  transform: scale(0.92);   /* playbook press state */
}

/* On cream bg the outline needs slightly more
   contrast so the button still looks like a button */
body.light-mode .color-mode-toggle {
  color: #3D3228;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.35288 8.95043C4.00437 6.17301 6.17301 4.00437 8.95043 3.35288C10.9563 2.88237 13.0437 2.88237 15.0496 3.35288C17.827 4.00437 19.9956 6.17301 20.6471 8.95044C21.1176 10.9563 21.1176 13.0437 20.6471 15.0496C19.9956 17.827 17.827 19.9956 15.0496 20.6471C13.0437 21.1176 10.9563 21.1176 8.95044 20.6471C6.17301 19.9956 4.00437 17.827 3.35288 15.0496C2.88237 13.0437 2.88237 10.9563 3.35288 8.95043Z' fill='rgba(45,58,30,0.05)' stroke='rgba(61,50,40,0.26)' stroke-width='1.5'/%3E%3C/svg%3E");
}

body.light-mode .color-mode-toggle:hover {
  color: #2D3A1E;
}

/* Show the right icon for the current mode.
   Dark mode → the moon is visible (tap to go light).
   Light mode → the sun is visible (tap to go dark). */
.color-mode-toggle .icon-sun  { display: none; }
.color-mode-toggle .icon-moon { display: block; }

body.light-mode .color-mode-toggle .icon-sun  { display: block; }
body.light-mode .color-mode-toggle .icon-moon { display: none; }

/* ============================================
   MODAL OVERLAY — the dark backdrop behind
   the modal. Clicking it closes the modal.
   ============================================ */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0);
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: flex-end; /* slides up from bottom on mobile */
  pointer-events: none;
  transition: background 0.45s var(--ease-gentle);
}

.modal-overlay.active {
  background: rgba(20, 16, 12, 0.7);
  pointer-events: auto;
}

/* ============================================
   MODAL — the signup form container.
   On mobile: 80% of viewport height, slides
   up from bottom.
   On desktop: centered card.
   ============================================ */
.modal {
  --modal-ink-rgb: 190, 168, 138;
  --modal-ink: rgb(204, 184, 156);
  --modal-ink-soft: rgba(var(--modal-ink-rgb), 0.88);
  --modal-ink-faint: rgba(var(--modal-ink-rgb), 0.66);
  --modal-border: rgba(var(--modal-ink-rgb), 0.38);
  --modal-border-strong: rgba(var(--modal-ink-rgb), 0.64);
  background: var(--loam-light);
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  border-radius: 20px 20px 0 0;
  overflow-y: auto;
  padding: 0;
  transform: translateY(100%);
  transition: transform 0.56s var(--ease-soft);
  position: relative;
  /* Custom scrollbar inside modal */
  scrollbar-width: thin;
  scrollbar-color: rgba(245, 240, 232, 0.15) transparent;
}

.modal::-webkit-scrollbar { width: 3px; }
.modal::-webkit-scrollbar-track { background: transparent; }
.modal::-webkit-scrollbar-thumb { background: rgba(245, 240, 232, 0.15); border-radius: 3px; }

.modal-overlay.active .modal {
  transform: translateY(0);
}

@media (min-width: 768px) {
  .modal-overlay {
    align-items: center;
  }

  .modal {
    border-radius: 20px;
    max-height: 80vh;
    transform: translateY(30px);
    opacity: 0;
    transition: transform 0.56s var(--ease-soft),
                opacity 0.42s var(--ease-gentle);
  }

  .modal-overlay.active .modal {
    transform: translateY(0);
    opacity: 1;
  }
}

/* ============================================
   MODAL HEADER — close button (feather X)
   ============================================ */
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.2rem 1.2rem 0;
  position: sticky;
  top: 0;
  z-index: 10;
}

.field-note-trigger {
  width: 40px;
  height: 40px;
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  border: none;
  background: none;
  color: var(--modal-ink-soft);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

.field-note-icon {
  width: 40px;
  height: 40px;
  opacity: 0.6;
  transition: opacity 0.24s var(--ease-gentle),
              transform 0.24s var(--ease-soft);
}

.field-note-trigger:hover .field-note-icon,
.field-note-trigger:focus-visible .field-note-icon {
  opacity: 1;
  transform: scale(1.05);
}

.field-note-trigger:active .field-note-icon {
  transform: scale(0.95);
}

.modal-close {
  width: 44px;
  height: 44px;
  border: none;
  background: none;
  color: var(--modal-ink-soft);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

.modal-close-icon {
  width: 40px;
  height: 40px;
  opacity: 0.6;
  transition: opacity 0.24s var(--ease-gentle),
              transform 0.24s var(--ease-soft);
}

.modal-close:hover .modal-close-icon,
.modal-close:focus-visible .modal-close-icon {
  opacity: 1;
  transform: scale(1.05);
}

.modal-close:active .modal-close-icon {
  transform: scale(0.95);
}

/* ============================================
   MODAL BODY — the form content
   ============================================ */
.modal-body {
  padding: 1rem 2rem 2.5rem;
}

.modal-title {
  font-family: var(--display);
  font-size: clamp(1.8rem, 5vw, 2.35rem);
  line-height: 1.1;
  color: var(--modal-ink-soft);
  text-align: center;
  margin: 0 0 0.75rem;
}

.modal-sub {
  color: var(--modal-ink-soft);
  text-align: center;
  max-width: 31rem;
  margin: 0 auto 2.25rem;
  font-size: 1rem;
  line-height: 1.65;
  text-wrap: balance;
}

/* ============================================
   FORM STYLES
   ============================================ */
.form-group {
  margin-bottom: 1rem;
  position: relative;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--modal-ink-soft);
  margin-bottom: 0.4rem;
  text-transform: uppercase;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 0.95rem 1.15rem;
  font-family: var(--sans);
  font-size: 1rem;
  border: 2px solid var(--modal-border);
  border-radius: 24px 20px 26px 18px / 18px 26px 20px 24px;
  background: rgba(var(--modal-ink-rgb), 0.045);
  color: var(--modal-ink-soft);
  box-shadow: inset 0 1px 0 rgba(var(--modal-ink-rgb), 0.04);
  transition: background-color 0.32s var(--ease-gentle),
              border-color 0.32s var(--ease-gentle),
              box-shadow 0.32s var(--ease-gentle),
              transform 0.24s var(--ease-soft);
  min-height: 58px;
  outline: none;
}

.form-group input::placeholder {
  color: var(--modal-ink-faint);
}

.form-group input:focus,
.form-group select:focus {
  background: rgba(var(--modal-ink-rgb), 0.07);
  border-color: var(--modal-border-strong);
  box-shadow: 0 8px 24px rgba(var(--modal-ink-rgb), 0.08),
              inset 0 1px 0 rgba(var(--modal-ink-rgb), 0.05);
  transform: translateY(-1px);
}

.form-group select {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23A68D6B' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 1.25rem center;
  background-size: 12px 8px;
  padding-right: 2.5rem;
}

.form-group select option {
  background: var(--loam-light);
  color: rgb(92, 75, 55);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

@media (max-width: 480px) {
  .form-row {
    grid-template-columns: 1fr;
  }
}

.submit-btn {
  display: block;
  width: max-content;
  background: none;
  color: rgba(var(--modal-ink-rgb), 0.8);
  padding: 0;
  border: none;
  cursor: pointer;
  margin: 1.6rem auto 0;
  transition: transform 0.24s var(--ease-soft),
              filter 0.32s var(--ease-gentle);
}

.submit-btn:hover .submit-icon,
.submit-btn:focus-visible .submit-icon {
  transform: translateY(-1px) scale(1.04);
  filter: brightness(1.05);
}

.submit-btn:focus-visible {
  outline: none;
}

.submit-btn:active .submit-icon {
  transform: scale(0.95);
}

.submit-icon {
  width: 4.75rem;
  height: 4.75rem;
  transition: transform 0.24s var(--ease-soft),
              filter 0.32s var(--ease-gentle);
}

.form-note {
  text-align: center;
  font-size: 0.7rem;
  color: var(--modal-ink-faint);
  margin-top: 1rem;
}

/* ============================================
   FIELD NOTE MODAL — shared explanatory shell
   ============================================ */
.field-note-overlay {
  position: fixed;
  inset: 0;
  z-index: 1100;
  display: flex;
  align-items: center;
  justify-content: center;
}

.field-note-overlay[hidden] {
  display: none;
}

.field-note-scrim {
  position: absolute;
  inset: 0;
  background: rgba(30, 26, 20, 0.65);
  opacity: 0;
  transition: opacity 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.field-note-modal {
  position: relative;
  width: clamp(360px, 50vw, 680px);
  max-height: 80vh;
  overflow-y: auto;
  padding: 2rem;
  background: var(--loam-light);
  border-radius: 20px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
  opacity: 0;
  transform: translateY(8px) scale(0.96);
  transition: opacity 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
              transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
}

.field-note-overlay.is-open .field-note-scrim {
  opacity: 1;
}

.field-note-overlay.is-open .field-note-modal {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.field-note-overlay.is-closing .field-note-modal {
  opacity: 0;
  transform: scale(0.98);
  transition: opacity 0.18s cubic-bezier(0.4, 0, 1, 1),
              transform 0.18s cubic-bezier(0.4, 0, 1, 1);
}

.field-note-overlay.is-closing .field-note-scrim {
  opacity: 0;
  transition: opacity 0.2s cubic-bezier(0.4, 0, 1, 1);
}

.field-note-title {
  margin: 0 0 0.75rem;
  font-family: var(--display);
  font-size: clamp(1.5rem, 4vw, 1.95rem);
  line-height: 1.2;
  color: var(--cream);
}

.field-note-body,
.field-note-edge {
  margin: 0;
  font-size: 1rem;
  line-height: 1.65;
  color: rgba(245, 240, 232, 0.8);
}

.field-note-edge {
  margin-top: 1rem;
  color: rgba(245, 240, 232, 0.62);
}

body.light-mode .field-note-modal {
  background: #F1E5D2;
  box-shadow: 0 18px 52px rgba(30, 26, 20, 0.22);
}

body.light-mode .field-note-title {
  color: #3D3228;
}

body.light-mode .field-note-body {
  color: rgba(61, 50, 40, 0.9);
}

body.light-mode .field-note-edge {
  color: rgba(61, 50, 40, 0.72);
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  .field-note-scrim,
  .field-note-modal,
  .field-note-overlay.is-closing .field-note-modal,
  .field-note-overlay.is-closing .field-note-scrim {
    transition-duration: 0.01ms;
  }

  .field-note-modal,
  .field-note-overlay.is-closing .field-note-modal {
    transform: none;
  }
}
</style>

<main class="hero" id="main-content">

  <!-- Scene container: locks flora + river to a consistent
       aspect ratio so mobile doesn't distort positions. -->
  <div class="scene-container">

    <!-- Grass ground plane — SVG matches the river's viewBox exactly
         so the top edge tracks the stream curve.
         Top bank of river: M-10,460 ... 1010,935
         Offset 120 SVG units upward (1.5 × 80-unit stream width):
         M-10,340 ... 1010,815
         Fill: var(--grass-color) behind an opacity mask so the
         mode-toggle crossfade works cleanly. -->
    <svg class="grass-band" viewBox="0 0 1000 1000"
         preserveAspectRatio="none"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <!-- Vertical Gaussian blur — the only technique that creates a
             fade which actually follows the curved edge. A gradient
             measures from a fixed y-coordinate, so the right side of
             the curve (which sits much lower in the SVG) is already
             near-opaque before the fade can start. Blur works
             differently: it spreads the fill colour outward from
             whatever edge the shape has, so the fade tracks the curve
             exactly. stdDeviation="0 30": no horizontal spread, 30
             SVG-units vertical spread (≈ 3% of the 1000-unit height).
             filter region y="-10%" height="120%" gives the blur
             room to expand above the top edge without clipping. -->
        <filter id="grassBlur" x="0" y="-10%" width="100%" height="120%"
                color-interpolation-filters="linearRGB">
          <feGaussianBlur stdDeviation="0 30"/>
        </filter>
      </defs>
      <!-- opacity="0.93": keeps the grass rich but not poster-paint flat.
           The blur softens the top ~90 SVG units (3× stdDeviation)
           above and below the curved edge; the interior stays solid. -->
      <path fill="var(--grass-color)"
            filter="url(#grassBlur)"
            opacity="0.93"
            d="M-10,340
               C100,370 220,500 300,530
               C380,560 470,560 550,560
               C630,560 720,720 800,750
               C880,780 970,815 1010,815
               L1010,1000 L-10,1000 Z"/>
    </svg>

         Tim's actual river-5-svgrepo SVG, recolored blue,

<!-- ==========================================
     JAVASCRIPT — modal open/close logic
     ========================================== -->
<script>
(function() {
  /* ---- Color mode toggle ---- */
  /*
     Reads the user's saved preference from
     localStorage (a tiny storage area in the
     browser that persists between visits). If
     they previously chose 'light', apply it
     immediately on page load so they never see
     a flash of dark content. If no preference
     is saved, default to dark.

     Clicking the toggle flips the mode, saves
     the choice, and updates the aria-label +
     aria-pressed so screen readers know what
     state changed.
  */
  var modeToggle = document.getElementById('color-mode-toggle');
  var STORAGE_KEY = 'gwc-color-mode';

  function applyMode(mode) {
    if (mode === 'light') {
      document.body.classList.add('light-mode');
      modeToggle.setAttribute('aria-label', 'Switch to dark mode');
      modeToggle.setAttribute('aria-pressed', 'true');
    } else {
      document.body.classList.remove('light-mode');
      modeToggle.setAttribute('aria-label', 'Switch to light mode');
      modeToggle.setAttribute('aria-pressed', 'false');
    }
  }

  // On load: read saved preference, apply it
  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { /* storage blocked */ }
  if (saved === 'light') applyMode('light');

  modeToggle.addEventListener('click', function() {
    var isLight = document.body.classList.contains('light-mode');
    var next = isLight ? 'dark' : 'light';
    applyMode(next);
    try { localStorage.setItem(STORAGE_KEY, next); } catch (e) { /* ignore */ }
  });

  /* ---- Modal logic ---- */
  var overlay = document.getElementById('modal-overlay');
  var modal = document.getElementById('modal');
  var openBtn = document.getElementById('open-modal');
  var closeBtn = document.getElementById('close-modal');
  var fieldNoteTrigger = document.getElementById('modal-field-note-trigger');
  var fieldNoteOverlay = document.getElementById('field-note-overlay');
  var fieldNoteModal = fieldNoteOverlay.querySelector('.field-note-modal');
  var fieldNoteTitle = document.getElementById('field-note-title');
  var fieldNoteBody = document.getElementById('field-note-body');
  var fieldNoteEdge = document.getElementById('field-note-edge');
  var fieldNoteCloseTimer = null;
  var activeFieldNoteTrigger = null;

  var FIELD_NOTES = {
    'get-involved-what-this-group-does': {
      kind: 'scope',
      title: 'What does this group do?',
      body: 'This group organizes simple trail cleanups along the Cleveland Greenway and sends quick email heads-ups before each one. The goal is to help neighbors find the next cleanup, know where to meet, and show up ready to help keep the trail system in good shape.',
      notFor: 'This is for cleanup updates and meetup details, not a full community forum or a constantly updated content feed.'
    }
  };

  function openModal() {
    overlay.classList.add('active');
    document.body.classList.add('modal-open');
    // Focus the close button for accessibility
    setTimeout(function() { closeBtn.focus(); }, 500);
  }

  function closeModal() {
    overlay.classList.remove('active');
    document.body.classList.remove('modal-open');
    openBtn.focus();
  }

  function openFieldNote(trigger) {
    var noteId = trigger.getAttribute('data-note-id');
    var note = FIELD_NOTES[noteId];
    if (!note) return;

    if (fieldNoteCloseTimer) {
      clearTimeout(fieldNoteCloseTimer);
      fieldNoteCloseTimer = null;
    }

    activeFieldNoteTrigger = trigger;
    fieldNoteTitle.textContent = note.title;
    fieldNoteBody.textContent = note.body;

    if (note.notFor) {
      fieldNoteEdge.hidden = false;
      fieldNoteEdge.textContent = note.notFor;
    } else {
      fieldNoteEdge.hidden = true;
      fieldNoteEdge.textContent = '';
    }

    fieldNoteOverlay.hidden = false;
    fieldNoteOverlay.classList.remove('is-closing');
    requestAnimationFrame(function() {
      fieldNoteOverlay.classList.add('is-open');
      fieldNoteModal.focus();
    });
  }

  function closeFieldNote() {
    if (fieldNoteOverlay.hidden) return;

    fieldNoteOverlay.classList.remove('is-open');
    fieldNoteOverlay.classList.add('is-closing');

    if (fieldNoteCloseTimer) clearTimeout(fieldNoteCloseTimer);
    fieldNoteCloseTimer = setTimeout(function() {
      fieldNoteOverlay.hidden = true;
      fieldNoteOverlay.classList.remove('is-closing');
      if (activeFieldNoteTrigger) activeFieldNoteTrigger.focus();
      fieldNoteCloseTimer = null;
    }, 200);
  }

  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  fieldNoteTrigger.addEventListener('click', function() {
    if (!fieldNoteOverlay.hidden) {
      closeFieldNote();
    } else {
      openFieldNote(fieldNoteTrigger);
    }
  });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      closeModal();
    }
  });

  fieldNoteOverlay.addEventListener('click', function(e) {
    if (e.target === fieldNoteOverlay || e.target.hasAttribute('data-close')) {
      closeFieldNote();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !fieldNoteOverlay.hidden) {
      closeFieldNote();
      return;
    }

    if (e.key === 'Escape' && overlay.classList.contains('active')) {
      closeModal();
    }
  });

})();
</script>

</body>
</html>
